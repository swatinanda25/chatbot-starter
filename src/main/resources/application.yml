server:
  port: 8080

spring:
  application:
    name: chatbot
  datasource:
    url: jdbc:sqlite:./data/store.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always   # demo: schema.sql drops and reseeds on every start

chatbot:
  gateway:
    # LiteLLM proxy: OpenAI-compatible. Provider keys live in the gateway, not here.
    base-url: ${LITELLM_BASE_URL:http://localhost:4000/v1}
    api-key: ${LITELLM_MASTER_KEY:sk-local-dev}
    model: ${CHATBOT_MODEL:chat-default}   # logical alias resolved by the gateway
    timeout: 120s                         # local Ollama inference is slower than a hosted API
  cors:
    # Origins of the standalone UI (ui/, served by scripts/ui.sh). Comma-separated.
    allowed-origins: ${CHATBOT_UI_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  demo-customer-id: C001                    # stub for auth: every session is this customer
  max-message-chars: 2000
  max-history-turns: ${CHATBOT_MAX_HISTORY_TURNS:6}       # customer turns each model call sees (0 = unlimited)
  model-context-tokens: ${CHATBOT_MODEL_CONTEXT_TOKENS:16384}  # keep equal to num_ctx in gateway/litellm-config.yaml
  default-agent: ${CHATBOT_DEFAULT_AGENT:support_router}   # agent for sessions that don't pick one (GET /api/agents)

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    com.demo.chatbot: INFO
    com.google.adk: WARN
